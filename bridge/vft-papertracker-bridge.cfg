# vft-papertracker-bridge options (same syntax as the command line, one or more per line).
# Edit, then restart the bridge:  vft-papertracker-bridge.exe --stop   and start the
# "VFT PaperTracker Bridge" task again (or just sign out and back in).
#
# Image orientation as seen in PaperTracker's face preview. PaperTracker's own flip buttons
# also work; use --rotate here if the image needs a 90-degree turn.
#   --rotate 0|90|180|270      --flip-h      --flip-v
#
# Which camera of the stereo pair to forward (left = left camera as seen from the user):
#   --view left|right
#
# Image tuning:
#   --gamma 1.0     (>1 brightens dark images)
#   --ir 255        (IR illuminator level 0..255)
#   --size 400      (output resolution NxN)
#
# Diagnostics: --verbose  (log: %LOCALAPPDATA%\vft-papertracker-bridge\bridge.log)

--view left
